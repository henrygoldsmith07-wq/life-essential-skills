name: Curriculum quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curriculum-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate curriculum, sources, sections, and internal links
        run: python3 scripts/validate_curriculum.py
      - name: Validate adaptive evidence graph, safety and calibration
        run: python3 scripts/validate_adaptive.py
      - name: Verify source registry render
        run: python3 scripts/render_registry.py --check
      - name: Verify learner assets contain current canonical data
        run: python3 scripts/build_learner.py --check
      - name: Verify feedback remediation text is current and case-specific
        run: python3 scripts/build_feedback_text.py --check
      - name: Verify case-decision criteria are current and fingerprints re-baselined
        run: python3 scripts/build_case_criteria.py --check
      - name: Verify cross-domain prerequisite graph matches the dependency map
        run: python3 scripts/build_cross_domain_prerequisites.py --check
      - name: Verify the static site serves every runtime asset and excludes solutions
        run: node scripts/static_smoke.js
      - name: Verify the fresh-scenario variation architecture (meaningful change, not numbers alone)
        run: python3 scripts/validate_variation.py
      - name: Report adaptive (Advanced) coverage without requiring closure
        run: python3 scripts/build_adaptive_coverage.py --check
      - name: Verify the roadmap never contradicts the deterministic engine
        run: node scripts/verify_roadmap.js
      - name: Verify the learner product views render and the AI boundary holds
        run: node scripts/verify_views.js
      - name: Verify every class the views emit is actually styled
        run: node scripts/verify_styles.js
      - name: Verify milestones and simulations keep their content promises
        run: node scripts/verify_content.js
      - name: Verify escaping and accessibility of every rendered surface
        run: node scripts/verify_accessibility.js
      - name: Verify the roadmap stays fast for a long-standing learner
        run: node scripts/verify_performance.js
      - name: Verify damaged stored evidence degrades safely
        run: node scripts/verify_resilience.js
      - name: Verify focus, ids and button types in the interaction layer
        run: node scripts/verify_interaction.js
      - name: Verify the copy the browser suite looks up still exists
        run: node scripts/verify_copy_contract.js
      - name: Test validator and link-check failure cases
        run: python3 -m unittest discover -s tests -v
      - name: Test the shared learner rules engine
        run: node --test tests/engine.test.js tests/evidence.test.js
      - name: Check dashboard JavaScript syntax
        run: node --check learner/app.js
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install locked development dependencies
        run: npm ci
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify learner, assessor, privacy and accessibility journeys
        run: npm run test:e2e
