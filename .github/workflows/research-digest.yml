name: Daily research digest

# Fetches new papers from every source in scripts/research/sources.js,
# summarises each selected paper with its own AI agent, and commits the
# static JSON under research/data/. Vercel redeploys on the push.
#
# Setup: Settings → Secrets and variables → Actions → New repository secret.
# Add any or all of these; every provider with a key runs agents in parallel:
#   NVIDIA_API_KEY       build.nvidia.com (Nemotron)
#   GROQ_API_KEY         console.groq.com (Qwen)
#   OPENROUTER_API_KEY   openrouter.ai (free Nemotron)
# Optional secrets: NCBI_API_KEY, S2_API_KEY, OPENALEX_API_KEY
# Optional variables: NVIDIA_MODEL, GROQ_MODEL, OPENROUTER_MODEL, and per
# provider <ID>_CONCURRENCY, <ID>_RPM, <ID>_DAILY_REQUESTS (e.g. GROQ_RPM),
# plus CONTACT_EMAIL and SITE_URL.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-back window in days (use more for a first backfill)'
        default: '2'
      max:
        description: 'Papers to summarise, one agent each (blank: 120 with NVIDIA or Groq, else 40)'
        default: ''

permissions:
  contents: write

concurrency:
  group: research-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test the digest pipeline
        run: node --test tests/research.test.js
      - name: Fetch and summarise new research
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          NVIDIA_CONCURRENCY: ${{ vars.NVIDIA_CONCURRENCY }}
          NVIDIA_RPM: ${{ vars.NVIDIA_RPM }}
          NVIDIA_DAILY_REQUESTS: ${{ vars.NVIDIA_DAILY_REQUESTS }}
          GROQ_CONCURRENCY: ${{ vars.GROQ_CONCURRENCY }}
          GROQ_RPM: ${{ vars.GROQ_RPM }}
          GROQ_DAILY_REQUESTS: ${{ vars.GROQ_DAILY_REQUESTS }}
          OPENROUTER_CONCURRENCY: ${{ vars.OPENROUTER_CONCURRENCY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
          DAYS: ${{ inputs.days || '2' }}
          MAX: ${{ inputs.max }}
          OPENROUTER_RPM: ${{ vars.OPENROUTER_RPM }}
          OPENROUTER_DAILY_REQUESTS: ${{ vars.OPENROUTER_DAILY_REQUESTS }}
        run: node scripts/research/run.js --days "$DAYS" ${MAX:+--max "$MAX"}
      - name: Commit the digest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/data
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "chore(research): daily digest $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
