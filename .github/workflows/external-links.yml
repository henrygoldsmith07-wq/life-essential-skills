name: External source links

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'data/sources.json'
      - 'scripts/check_external_links.py'
      - '.external-link-exceptions.json'
      - '.github/workflows/external-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check public URLs with retries
        run: python3 scripts/check_external_links.py
